name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-timeout

      - name: Compile and check requirements
        run: make check

      - name: Run tests
        run: make test

      # Only errors that break a script: syntax errors and undefined names.
      # The style checks of 'make lint' are not clean yet.
      - name: Check for syntax errors and undefined names
        run: |
          pip install flake8
          flake8 --select=E9,F63,F7,F82 --show-source *.py tests/
