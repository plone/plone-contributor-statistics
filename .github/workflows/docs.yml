name: Docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # configure-pages reads the Pages site
    permissions:
      contents: read
      pages: read
    concurrency:
      group: docs-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-docs.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-docs.txt

      # The community page at the root, the documentation below docs/.
      # Warnings are errors: a broken reference fails the pull request.
      - name: Build the site
        run: make site

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: _site

  # Publishes the community page at https://plone.github.io/plone-contributor-statistics/
  # and the documentation at https://plone.github.io/plone-contributor-statistics/docs/
  # Needs GitHub Pages enabled with the source "GitHub Actions".
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.repository == 'plone/plone-contributor-statistics' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
